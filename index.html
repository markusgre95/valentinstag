<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Für Lea </title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: white;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.15);
  padding: 30px 20px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  width: 100%;
  max-width: 400px;
  position: relative;
}

img {
  width: 100%;
  max-width: 250px;
  border-radius: 20px;
  margin-bottom: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

h1 {
  margin-bottom: 10px;
  font-size: 1.8em;
}

p {
  font-size: 1.1em;
}

h2 {
  margin-top: 20px;
  font-size: 1.4em;
}

.buttons {
  margin-top: 25px;
  position: relative;
  height: 120px;
}

button {
  padding: 15px 25px;
  border-radius: 30px;
  border: none;
  font-size: 1.1em;
  cursor: pointer;
  transition: transform 0.2s ease;
  min-width: 100px;
  position: absolute;
}

#yes {
  background: white;
  color: #ff4d6d;
  left: 20%;
  bottom: 0;
  position: relative;
}

#no {
  background: #ff4d6d;
  color: white;
  right: 20%;
  bottom: 0;
}

/* Mobile-Optimierung */
@media (max-width: 500px) {
  h1 { font-size: 1.5em; }
  h2 { font-size: 1.2em; }
  p { font-size: 1em; }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 15px; /* Abstand zwischen Buttons */
    height: auto;
    position: static; /* absolute entfernen */
  }

  button {
    position: relative !important; /* absolute aufheben */
    transform: none !important;    /* transform entfernen */
    padding: 12px 20px;
    font-size: 1em;
    min-width: 90px;
  }
}
</style>
</head>

<body>

<div class="card">
  <img src="lea.jpg" alt="Lea ">
  
  <h1>Lea </h1>
  
  <p>
    Du bringst mein Herz zum Lächeln.<br>
    Und manchmal auch zum Stolpern 🙈
  </p>

  <h2>Willst du mein Valentin sein?</h2>

  <div class="buttons">
    <button id="yes" onclick="sayYes()">Ja 🫶</button>
    <button id="no" onmouseover="moveButton()" ontouchstart="moveButton()">Nein 🙄</button>
  </div>
</div>

<script>
function sayYes() {
  const overlay = document.createElement("div");
  overlay.style.cssText = `
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    color:white;
    padding:20px;
    flex-direction: column;
  `;
  overlay.innerHTML = `
    <h1>Ich wusste es 😍❤️</h1>
    <p>Hihi</p>
  `;
  document.body.appendChild(overlay);
  
  document.querySelector(".card").style.display = "none";
}

function moveButton() {
  const button = document.getElementById("no");
  const card = document.querySelector(".card");

  const cardRect = card.getBoundingClientRect();
  const btnRect = button.getBoundingClientRect();

  // Prüfen, ob wir auf Mobile sind
  const isMobile = window.innerWidth < 500;

  // Maximalpositionen innerhalb der Karte
  const maxX = cardRect.width - btnRect.width - 20;
  const maxY = cardRect.height - btnRect.height - 20;

  // Desktop: volle Bewegung, Mobile: sanftere Bewegung
  const jumpX = isMobile ? Math.random() * (maxX / 2) : Math.random() * maxX;
  const jumpY = isMobile ? Math.random() * (maxY / 2) : Math.random() * maxY;

  button.style.transform = `translate(${jumpX}px, ${jumpY}px)`;
}

// Optional: Beim Fenstergrößenwechsel Buttons zurücksetzen
window.addEventListener("resize", () => {
  const button = document.getElementById("no");
  button.style.transform = `translate(0,0)`;
});
</script>

</body>
</html>

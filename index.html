<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Für Lea </title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: white;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.15);
  padding: 30px 20px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  width: 100%;
  max-width: 400px;
}

img {
  width: 100%;
  max-width: 250px;
  border-radius: 20px;
  margin-bottom: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

h1 {
  margin-bottom: 10px;
  font-size: 1.8em;
}

p {
  font-size: 1.1em;
}

h2 {
  margin-top: 20px;
  font-size: 1.4em;
}

.buttons {
  margin-top: 25px;
  position: relative;
  height: 100px;
}

button {
  padding: 15px 25px;
  border-radius: 30px;
  border: none;
  font-size: 1.1em;
  cursor: pointer;
  margin: 10px;
  transition: 0.2s;
  min-width: 100px;
}

#yes {
  background: white;
  color: #ff4d6d;
}

#no {
  background: #ff4d6d;
  color: white;
  position: absolute;
}
</style>
</head>

<body>

<div class="card">
  <img src="lea.jpg" alt="Lea ">
  
  <h1>Lea </h1>
  
  <p>
    Du bringst mein Herz zum Lächeln.<br>
    Und manchmal auch zum Stolpern 🙈
  </p>

  <h2>Willst du mein Valentin sein?</h2>

  <div class="buttons">
    <button id="yes" onclick="sayYes()">Ja 🫶</button>
    <button id="no" ontouchstart="moveButton()" onmouseover="moveButton()">Nein 🙄</button>
  </div>
</div>

<script>
function sayYes() {
  document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;text-align:center;color:white;padding:20px;">
      <div>
        <h1>Ich wusste es 😍❤️</h1>
        <p>Hihi</p>
      </div>
    </div>
  `;
}

function moveButton() {
  const button = document.getElementById("no");
  const x = Math.random() * 150 - 75;
  const y = Math.random() * 80 - 40;
  button.style.transform = \`translate(\${x}px, \${y}px)\`;
}
</script>

</body>
</html>
